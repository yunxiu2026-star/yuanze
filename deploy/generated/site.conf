# Render using scripts/render_deploy.py. Included inside nginx http {}.
limit_req_zone $binary_remote_addr zone=b2b_intake:10m rate=10r/m;
server {
    listen 80;
    server_name demo.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name demo.example;
    ssl_certificate /etc/letsencrypt/live/demo.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example/privkey.pem;
    root /srv/b2b/current/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\. { deny all; }
    location = /build.json { return 404; }
    location ~ ^/api/v1/(sample-requests|product-brief|rfqs)$ {
        limit_except POST { deny all; }
        limit_req zone=b2b_intake burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { return 404; }
    include /srv/b2b/current/deploy/generated/redirects.conf;
    location / {
        # Nginx performs directory slash redirects itself; query strings retained.
        try_files $uri $uri/ $uri/index.html =404;
    }
}
server {
    listen 80;
    server_name geo.demo.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name geo.demo.example;
    ssl_certificate /etc/letsencrypt/live/geo.demo.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.demo.example/privkey.pem;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:9322;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
}

{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name=='home' %}<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>
{% elif name=='chart' %}<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 16v-4m5 4V7m5 9v-6"/>
{% elif name=='search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name=='target' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m12 12 7 7m-1-3 1 3-3-1"/>
{% elif name=='spark' %}<path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7ZM20 3v4m-2-2h4"/>
{% elif name=='social' %}<circle cx="6" cy="12" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="18" cy="19" r="3"/><path d="m9 10 6-4m-6 8 6 4"/>
{% elif name=='settings' %}<path d="m9 3-1 3-3 1-2 4 2 2 1 3 4 2 3-1 3 1 4-3-1-3 1-3-3-3-3 1Z"/><circle cx="12" cy="11" r="3"/>
{% elif name=='clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name=='menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name=='close' %}<path d="m6 6 12 12M18 6 6 18"/>
{% elif name=='arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name=='check' %}<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>
{% elif name=='info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>
{% elif name=='download' %}<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>
{% elif name=='inbox' %}<path d="M4 4h16v16H4Z"/><path d="m4 7 8 6 8-6M9 16h6"/>
{% elif name=='book' %}<path d="M12 5v15M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-2-1-6-2-10 1Z"/>
{% else %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>{% endif %}
</svg>
{%- endmacro %}

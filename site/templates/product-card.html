<article class="product-card" data-product="{{ p.id }}" data-family="{{ p.collection }}" data-category="{{ p.category }}" data-search="{{ (tr(p.title,lang)+' '+p.category+' '+p.collection)|lower }}"><a class="product-art" href="{{ route('/products/'+p.id+'/',lang) }}"><img loading="lazy" src="{{ p.image }}" width="1200" height="900" alt="{{ tr(p.title,lang) }}"><small>Private label · Your logo here</small></a><div class="product-copy"><h2><a href="{{ route('/products/'+p.id+'/',lang) }}">{{ tr(p.title,lang) }}</a></h2><p>{{ tr(p.summary,lang) }}</p><div class="chips">{% for b in p.badges %}<span>{{ b }}</span>{% endfor %}</div><button data-sample data-topic="{{ tr(p.title,lang) }}" class="text-link">{{ 'Request a sample' if lang=='en' else 'اطلب عينة' }} →</button></div></article>
